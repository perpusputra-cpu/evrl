services:
  - type: web
    name: ecobrick-virtual-research-lab
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: open-mistral-nemo
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
